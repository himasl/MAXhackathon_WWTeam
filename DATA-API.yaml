# DATA-API 1.0 — обязательные HTTP-проверки основного сценария «Маршрута».
# Секретов здесь нет. Роль "user" = заголовок "Authorization: Bearer <тестовый токен>";
# тестовые токены передаются через защищённый канал проекта оценки решений
# (на сервере задаются переменной окружения TEST_ACCESS_TOKENS).

schemaVersion: "1.0"

solution:
  name: "Маршрут — навигатор студента после переезда"
  teamId: "t818"

api:
  baseUrl: "https://marshrut-tf5o.onrender.com"
  openapi: "./openapi.yaml"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "Доступность сервиса"
    method: "GET"
    path: "/health"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status"]
    timeoutMs: 5000
    repeatable: true

  - id: "auth-required"
    name: "Без токена доступ к данным запрещён"
    description: "Запрос без Authorization возвращает 401 в едином формате ошибок."
    method: "GET"
    path: "/api/v1/me"
    role: "public"
    expected:
      statusCodes: [401]
      contentType: "application/json"
      requiredFields: ["error"]
    timeoutMs: 5000
    repeatable: true

  - id: "current-user"
    name: "Текущий пользователь"
    method: "GET"
    path: "/api/v1/me"
    role: "user"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "max_user_id"]
    timeoutMs: 5000
    repeatable: true

  - id: "save-profile"
    name: "Сохранение ответов онбординга"
    description: "Студент 18 лет, очная форма, Москва, общежитие, без регистрации и прикрепления."
    method: "PUT"
    path: "/api/v1/profile"
    role: "user"
    dependsOn: ["current-user"]
    request:
      headers:
        Content-Type: "application/json"
      body:
        age: 18
        region_code: "77"
        education_type: "FULL_TIME"
        housing_type: "DORMITORY"
        has_registration: false
        has_clinic_attachment: false
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["age", "region_code", "education_type", "housing_type"]
    timeoutMs: 5000
    repeatable: true

  - id: "profile-validation"
    name: "Некорректный профиль отклоняется"
    method: "PUT"
    path: "/api/v1/profile"
    role: "user"
    request:
      headers:
        Content-Type: "application/json"
      body:
        age: "восемнадцать"
        region_code: "77"
        education_type: "FULL_TIME"
        housing_type: "DORMITORY"
        has_registration: false
        has_clinic_attachment: false
    expected:
      statusCodes: [422]
      contentType: "application/json"
      requiredFields: ["error"]
    timeoutMs: 5000
    repeatable: true

  - id: "get-profile"
    name: "Чтение профиля"
    method: "GET"
    path: "/api/v1/profile"
    role: "user"
    dependsOn: ["save-profile"]
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["age", "region_code", "has_registration", "has_clinic_attachment"]
    timeoutMs: 5000
    repeatable: true

  - id: "create-route"
    name: "Построение персонального маршрута"
    description: "Правила сценария отбирают шаги под профиль; предыдущий активный маршрут архивируется."
    method: "POST"
    path: "/api/v1/routes"
    role: "user"
    dependsOn: ["save-profile"]
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["id", "status", "progress", "steps", "next_step_id"]
      bodySchema:
        type: "object"
        required: ["id", "status", "progress", "steps"]
        properties:
          id:
            type: "string"
          status:
            type: "string"
            enum: ["ACTIVE"]
          steps:
            type: "array"
            minItems: 1
    timeoutMs: 5000
    repeatable: false
    extract:
      routeId: "$.id"
      stepId: "$.steps[0].id"

  - id: "current-route"
    name: "Текущий маршрут"
    method: "GET"
    path: "/api/v1/routes/current"
    role: "user"
    dependsOn: ["create-route"]
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "progress", "steps"]
    timeoutMs: 5000
    repeatable: true

  - id: "get-step"
    name: "Карточка шага с причиной, документами и источником"
    method: "GET"
    path: "/api/v1/routes/{route_id}/steps/{step_id}"
    role: "user"
    dependsOn: ["create-route"]
    request:
      path:
        route_id: "${routeId}"
        step_id: "${stepId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "title", "reason", "documents", "sources", "location"]
    timeoutMs: 5000
    repeatable: true

  - id: "complete-step"
    name: "Отметка шага выполненным"
    method: "POST"
    path: "/api/v1/routes/{route_id}/steps/{step_id}/complete"
    role: "user"
    dependsOn: ["get-step"]
    request:
      path:
        route_id: "${routeId}"
        step_id: "${stepId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "progress", "steps"]
    timeoutMs: 5000
    repeatable: false

  - id: "complete-step-twice"
    name: "Повторное выполнение шага — конфликт"
    method: "POST"
    path: "/api/v1/routes/{route_id}/steps/{step_id}/complete"
    role: "user"
    dependsOn: ["complete-step"]
    request:
      path:
        route_id: "${routeId}"
        step_id: "${stepId}"
    expected:
      statusCodes: [409]
      contentType: "application/json"
      requiredFields: ["error"]
    timeoutMs: 5000
    repeatable: true

  - id: "reopen-step"
    name: "Возврат шага в работу"
    method: "POST"
    path: "/api/v1/routes/{route_id}/steps/{step_id}/reopen"
    role: "user"
    dependsOn: ["complete-step"]
    request:
      path:
        route_id: "${routeId}"
        step_id: "${stepId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "progress", "steps"]
    timeoutMs: 5000
    repeatable: false

  - id: "calendar-link"
    name: "Ссылка на файл календаря со сроком шага"
    method: "POST"
    path: "/api/v1/routes/{route_id}/steps/{step_id}/calendar-link"
    role: "user"
    dependsOn: ["create-route"]
    request:
      path:
        route_id: "${routeId}"
        step_id: "${stepId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["url", "expires_in"]
    timeoutMs: 5000
    repeatable: true

  - id: "regions"
    name: "Справочник регионов РФ"
    method: "GET"
    path: "/api/v1/regions"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 89
    timeoutMs: 5000
    repeatable: true

  - id: "universities"
    name: "Каталог вузов-партнёров пилота"
    method: "GET"
    path: "/api/v1/universities"
    role: "public"
    request:
      query:
        region_code: "16"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
    timeoutMs: 5000
    repeatable: true

  - id: "stats"
    name: "Обезличенные метрики пилота"
    method: "GET"
    path: "/api/v1/stats"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["users", "routes", "steps", "by_scenario", "by_university"]
    timeoutMs: 5000
    repeatable: true

  - id: "missing-route"
    name: "Несуществующий маршрут — 404 в едином формате"
    method: "GET"
    path: "/api/v1/routes/{route_id}/steps/{step_id}"
    role: "user"
    request:
      path:
        route_id: "00000000-0000-0000-0000-000000000000"
        step_id: "00000000-0000-0000-0000-000000000000"
    expected:
      statusCodes: [404]
      contentType: "application/json"
      requiredFields: ["error"]
    timeoutMs: 5000
    repeatable: true
