services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marshrut
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marshrut"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/marshrut}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SCENARIO_DATA_DIR: /app/data/scenarios
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      DEV_MAX_USER_ID: ${DEV_MAX_USER_ID:-123456}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
