# Local run: docker compose up --build  →  Mini App + API on http://localhost:8000
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marshrut
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marshrut"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/marshrut
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      DEV_MAX_USER_ID: ${DEV_MAX_USER_ID:-123456}
      # Long polling works without a public HTTPS address, so the bot runs locally too.
      BOT_MODE: ${BOT_MODE:-polling}
    ports:
      - "8000:8000"
    # Lets RAG_URL=http://host.docker.internal:8090/ask reach tools/fake_rag.py on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # Optional RAG assistant (docs/rag.md): docker compose --profile rag up --build
  # and set RAG_URL=http://rag:8090/ask (plus RAG_TIMEOUT_SECONDS) in .env.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    profiles: ["rag"]
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.34.4
    profiles: ["rag"]
    volumes:
      - ollama_data:/root/.ollama

  rag:
    build: ./backend/app/ai
    profiles: ["rag"]
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      # Ollama Cloud instead of the local ollama service: OLLAMA_API_KEY + LLM_MODEL=gpt-oss:20b
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      RAG_TOKEN: ${RAG_TOKEN:-}
    volumes:
      - rag_models:/models
    depends_on:
      - qdrant
      - ollama

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  rag_models:
