openapi: 3.1.0
info:
  title: Маршрут API
  description: 'API сервиса «Маршрут»: персональный маршрут действий для студента
    после переезда в другой регион. Сервис не является государственным и не принимает
    юридически значимых решений.'
  version: 1.0.0
paths:
  /api/v1/auth/max:
    post:
      tags:
      - auth
      summary: Login With Max
      description: 'Exchange MAX Mini App ``initData`` for an access token.


        The backend validates the HMAC signature with the bot token and never trusts
        a

        ``user_id`` sent by the client.'
      operationId: login_with_max_api_v1_auth_max_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaxAuthRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
