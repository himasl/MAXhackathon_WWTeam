openapi: 3.1.0
info:
  title: Маршрут API
  description: 'API сервиса «Маршрут»: персональный маршрут действий для студента
    после переезда в другой регион. Сервис не является государственным и не принимает
    юридически значимых решений.'
  version: 1.0.0
paths:
  /api/v1/auth/max:
    post:
      tags:
      - auth
      summary: Login With Max
      description: 'Exchange MAX Mini App ``initData`` for an access token.


        The backend validates the HMAC signature with the bot token and never trusts
        a

        ``user_id`` sent by the client.'
      operationId: login_with_max_api_v1_auth_max_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaxAuthRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me:
    get:
      tags:
      - users
      summary: Get Me
      operationId: get_me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/profile:
    get:
      tags:
      - users
      summary: Get Profile
      operationId: get_profile_api_v1_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
    put:
      tags:
      - users
      summary: Save Profile
      operationId: save_profile_api_v1_profile_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePayload'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/routes:
    post:
      tags:
      - routes
      summary: Create Route
      description: Build a personal route from the saved profile. A previous active
        route is archived.
      operationId: create_route_api_v1_routes_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/routes/current:
    get:
      tags:
      - routes
      summary: Get Current Route
      operationId: get_current_route_api_v1_routes_current_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /api/v1/routes/{route_id}/steps/{step_id}:
    get:
      tags:
      - routes
      summary: Get Route Step
      operationId: get_route_step_api_v1_routes__route_id__steps__step_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Route Id
      - name: step_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Step Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteStepDetailResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/routes/{route_id}/steps/{step_id}/complete:
    post:
      tags:
      - routes
      summary: Complete Route Step
      operationId: complete_route_step_api_v1_routes__route_id__steps__step_id__complete_post
      security:
      - HTTPBearer: []
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Route Id
      - name: step_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Step Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/routes/{route_id}/steps/{step_id}/reopen:
    post:
      tags:
      - routes
      summary: Reopen Route Step
      operationId: reopen_route_step_api_v1_routes__route_id__steps__step_id__reopen_post
      security:
      - HTTPBearer: []
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Route Id
      - name: step_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Step Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/routes/{route_id}/remind:
    post:
      tags:
      - routes
      summary: Send Reminder
      description: 'Send the next open step to the user''s MAX chat right now.


        ``sent`` is false when the bot is not configured or MAX did not accept the
        message.'
      operationId: send_reminder_api_v1_routes__route_id__remind_post
      security:
      - HTTPBearer: []
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Route Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/routes/{route_id}/steps/{step_id}/calendar-link:
    post:
      tags:
      - routes
      summary: Create Calendar Link
      description: 'Signed link to an .ics file with the step''s recommended deadline.


        The link opens in the phone''s browser or calendar app, so it carries its
        own token

        instead of the Authorization header. It grants access to this event only.'
      operationId: create_calendar_link_api_v1_routes__route_id__steps__step_id__calendar_link_post
      security:
      - HTTPBearer: []
      parameters:
      - name: route_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Route Id
      - name: step_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Step Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarLinkResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/config:
    get:
      tags:
      - catalog
      summary: Get Config
      description: 'Public client settings: the bot link used for invitations.'
      operationId: get_config_api_v1_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/universities:
    get:
      tags:
      - catalog
      summary: List Universities
      description: Pilot partner universities, optionally filtered by region.
      operationId: list_universities_api_v1_universities_get
      parameters:
      - name: region_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Region Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UniversityResponse'
                title: Response List Universities Api V1 Universities Get
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /api/v1/stats:
    get:
      tags:
      - public
      summary: Get Stats
      description: 'Anonymous pilot metrics: routes, completion rate, steps done from
        the chat,

        reminders and the median number of days until registration is done.'
      operationId: get_stats_api_v1_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/calendar/{token}.ics:
    get:
      tags:
      - public
      summary: Get Calendar File
      description: Calendar file for a step deadline, addressed by a signed link token.
      operationId: get_calendar_file_api_v1_calendar__token__ics_get
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            text/calendar: {}
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /health:
    get:
      tags:
      - system
      summary: Health
      description: 'Liveness. ``bot`` shows how the MAX bot is connected: off, polling,
        webhook, webhook_failed.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    AppConfigResponse:
      properties:
        bot_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Bot Username
        bot_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Bot Url
      type: object
      required:
      - bot_username
      - bot_url
      title: AppConfigResponse
    AuthResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
        start_param:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Param
        user:
          $ref: '#/components/schemas/CurrentUserResponse'
      type: object
      required:
      - access_token
      - expires_in
      - start_param
      - user
      title: AuthResponse
    CalendarLinkResponse:
      properties:
        url:
          type: string
          title: Url
        expires_in:
          type: integer
          title: Expires In
      type: object
      required:
      - url
      - expires_in
      title: CalendarLinkResponse
    Citizenship:
      type: string
      enum:
      - RU
      - FOREIGN
      title: Citizenship
    CurrentUserResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        max_user_id:
          type: integer
          title: Max User Id
      type: object
      required:
      - id
      - max_user_id
      title: CurrentUserResponse
    EducationType:
      type: string
      enum:
      - FULL_TIME
      - PART_TIME
      title: EducationType
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorResponse
    GroupStats:
      properties:
        code:
          type: string
          title: Code
        title:
          type: string
          title: Title
        routes:
          type: integer
          title: Routes
        completed:
          type: integer
          title: Completed
      type: object
      required:
      - code
      - title
      - routes
      - completed
      title: GroupStats
    HousingType:
      type: string
      enum:
      - DORMITORY
      - RENT
      - RELATIVES
      - OTHER
      title: HousingType
    MaxAuthRequest:
      properties:
        init_data:
          type: string
          maxLength: 8192
          minLength: 1
          title: Init Data
      additionalProperties: false
      type: object
      required:
      - init_data
      title: MaxAuthRequest
    ProfilePayload:
      properties:
        age:
          type: integer
          title: Age
        region_code:
          type: string
          title: Region Code
        education_type:
          $ref: '#/components/schemas/EducationType'
        housing_type:
          $ref: '#/components/schemas/HousingType'
        has_registration:
          type: boolean
          title: Has Registration
        has_clinic_attachment:
          type: boolean
          title: Has Clinic Attachment
        citizenship:
          $ref: '#/components/schemas/Citizenship'
          default: RU
        university_code:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: University Code
      additionalProperties: false
      type: object
      required:
      - age
      - region_code
      - education_type
      - housing_type
      - has_registration
      - has_clinic_attachment
      title: ProfilePayload
    ProfileResponse:
      properties:
        age:
          type: integer
          title: Age
        region_code:
          type: string
          title: Region Code
        education_type:
          $ref: '#/components/schemas/EducationType'
        housing_type:
          $ref: '#/components/schemas/HousingType'
        has_registration:
          type: boolean
          title: Has Registration
        has_clinic_attachment:
          type: boolean
          title: Has Clinic Attachment
        citizenship:
          $ref: '#/components/schemas/Citizenship'
          default: RU
        university_code:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: University Code
      additionalProperties: false
      type: object
      required:
      - age
      - region_code
      - education_type
      - housing_type
      - has_registration
      - has_clinic_attachment
      title: ProfileResponse
    ReminderResponse:
      properties:
        sent:
          type: boolean
          title: Sent
        step_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Step Id
      type: object
      required:
      - sent
      - step_id
      title: ReminderResponse
    RouteProgress:
      properties:
        completed:
          type: integer
          title: Completed
        total:
          type: integer
          title: Total
        percent:
          type: integer
          title: Percent
      type: object
      required:
      - completed
      - total
      - percent
      title: RouteProgress
    RouteResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
